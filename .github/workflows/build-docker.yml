name: Build docker

on:
  push:
    branches: [main]
    paths: [src/**, Dockerfile, requirements.txt, .github/workflows/build-docker.yml]
  pull_request:
    paths: [src/**, Dockerfile, requirements.txt, .github/workflows/build-docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
